<section class="snap relative w-full min-h-screen bg-black px-6 pt-28 md:pt-12">

  <!-- FIXED NEON GLOW OVERLAY -->
  <div class="glow-overlay pointer-events-none"></div>

  <!-- SCROLLABLE CONTENT -->
  <div class="scroll-area overflow-y-auto pb-10 max-h-[calc(100vh-8rem)]
            flex flex-col items-center">


    <h2 
      class="text-xl sm:text-2xl md:text-4xl font-light text-white tracking-wide mb-4 neon-title">
      Fitnessworld Shop
    </h2>

    <div class="w-full max-w-6xl mx-auto">

      <div
        class="grid 
               grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5
               gap-4 sm:gap-6 md:gap-8 lg:gap-10
               w-full">

        <!-- PRODUCT CARD -->
            <div
              *ngFor="let product of products"
              class="flex flex-col text-center transition-transform duration-300 hover:scale-[1.02] cursor-pointer relative
                    h-auto min-h-[260px] sm:min-h-[300px] md:min-h-[340px]"
              (mouseenter)="onMouseEnter(product.id)"
              (mouseleave)="onMouseLeave()"
            >

            <img
              [src]="getImageUrl(product.imageUrl)"
              alt="{{ product.name }}"
              class="w-[clamp(70px,12vw,140px)] h-[clamp(70px,12vw,140px)]
                    object-contain mx-auto mb-4 drop-shadow-[0_0_12px_rgba(255,0,128,0.3)]"
              (click)="toggleDescription(product.id)"
            />

          <h3 class="text-white text-sm sm:text-base md:text-lg mb-1">
            {{ product.name }}
          </h3>

          <p class="text-[#ff0080] text-xl sm:text-2xl font-bold drop-shadow-[0_0_8px_rgba(255,0,128,0.4)] mb-2">
            ${{ product.price }}
          </p>

          <div class="flex-grow"></div>

          <div
            *ngIf="expandedProductId === product.id"
            class="absolute inset-0 bg-black/80 text-white/80 text-sm p-4 flex items-center justify-center
                  opacity-0 animate-fadeIn rounded-lg z-10">
            {{ product.description }}
          </div>

          <button
            class="inline-block relative z-20 mt-3 px-4 py-1.5 rounded-full bg-[#ff0080] text-black text-sm font-medium
                   shadow-[0_0_12px_rgba(255,0,128,0.5)] hover:brightness-110 transition"
            (click)="$event.stopPropagation(); addToCart(product)"
          >
            Add to cart
          </button>

        </div>

      </div>
    </div>
  </div>
</section>
