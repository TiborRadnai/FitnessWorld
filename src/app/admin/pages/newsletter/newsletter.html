<div class="flex flex-col gap-10">

  <!-- HEADER -->
  <div>
    <h1 class="text-3xl font-bold mb-2">Newsletter</h1>
    <p class="text-white/60">Create, schedule, and send newsletters to your audience.</p>
  </div>

  <!-- MAIN GRID -->
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">

    <!-- EDITOR PANEL -->
    <div class="xl:col-span-2 bg-white/5 border border-pink border-opacity-20 rounded-xl p-6 backdrop-blur-md
                shadow-[0_0_12px_rgba(255,16,240,0.25)]">

      <h2 class="text-xl font-semibold mb-4">Content Editor</h2>

      <!-- NATÍV TINYMCE EDITOR -->
      <div id="editor" class="bg-white text-black rounded-lg overflow-hidden"></div>

    </div>

    <!-- RECIPIENTS PANEL -->
    <div class="bg-white/5 border border-pink border-opacity-20 rounded-xl p-6 backdrop-blur-md
                shadow-[0_0_12px_rgba(255,16,240,0.25)]">

      <h2 class="text-xl font-semibold mb-4">Recipients</h2>

      <div class="flex flex-col gap-4">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="recipients" class="accent-pink" />
          <span>Everyone</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="recipients" class="accent-pink" />
          <span>Rank: Gold</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="recipients" class="accent-pink" />
          <span>Rank: Silver</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="radio" name="recipients" class="accent-pink" />
          <span>Rank: Bronze</span>
        </label>
      </div>

    </div>

  </div>

  <!-- AUTOMATION PANEL -->
  <div class="bg-white/5 border border-pink border-opacity-20 rounded-xl p-6 backdrop-blur-md
              shadow-[0_0_12px_rgba(255,16,240,0.25)]">

    <h2 class="text-xl font-semibold mb-4">Automation</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div>
        <label class="block text-sm mb-1 opacity-70">Send Mode</label>
        <select class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white">
          <option>Send now</option>
          <option>Schedule once</option>
          <option>Repeat monthly</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-1 opacity-70">Schedule Date</label>
        <input type="datetime-local"
               class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white" />
      </div>

      <div>
        <label class="block text-sm mb-1 opacity-70">Test Email</label>
        <input type="email" placeholder="your@email"
               class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white" />
      </div>

    </div>

    <div class="mt-6 flex justify-end">
      <button
        (click)="openPreview()"
        class="px-6 py-3 bg-white/10 hover:bg-white/20 rounded-lg font-semibold transition mr-4">
        Preview
      </button>

        <button
        (click)="sendNewsletter()"
        class="px-6 py-3 bg-pink hover:bg-pink/80 rounded-lg font-semibold
                shadow-[0_0_12px_rgba(255,16,240,0.35)] hover:shadow-[0_0_18px_rgba(255,16,240,0.55)] transition">
        Send Newsletter
        </button>

    </div>

  </div>

</div>

<!-- PREVIEW MODAL -->
<app-newsletter-preview
  *ngIf="showPreview"
  [html]="content"
  (close)="closePreview()">
</app-newsletter-preview>
