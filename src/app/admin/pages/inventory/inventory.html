<div class="p-10 text-white">

  <!-- Header -->
  <div class="flex items-center justify-between mb-10">
    <h1 class="text-3xl font-bold mb-2">Inventory</h1>

    <button
      (click)="openAddProduct()"
      class="px-5 py-2 bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-lg transition"
    >
      + Add Product
    </button>
  </div>

  <!-- Table wrapper -->
  <div class="overflow-x-auto rounded-xl border border-white/10 bg-white/10 backdrop-blur-md shadow-xl">
    <table class="min-w-full text-sm">
      <thead class="bg-white/5 text-white/70 uppercase text-xs tracking-wider border-b border-white/10">
        <tr>
          <th class="px-6 py-4 text-left">Image</th>
          <th class="px-6 py-4 text-left">Name</th>
          <th class="px-6 py-4 text-left">Price</th>
          <th class="px-6 py-4 text-left">Stock</th>
          <th class="px-6 py-4 text-left">Active</th>
          <th class="px-6 py-4 text-left">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let product of products()"
          class="border-b border-white/10 hover:bg-white/5 transition"
        >
          <td class="px-6 py-4">
            <img
              [src]="product.imageUrl"
              alt="{{ product.name }}"
              class="w-16 h-16 object-cover rounded-lg"
            />
          </td>

          <td class="px-6 py-4 font-medium">{{ product.name }}</td>

          <td class="px-6 py-4">
            <span class="font-semibold text-pink-400">€{{ product.price }}</span>
          </td>

          <td class="px-6 py-4">
            <span
              class="font-semibold"
              [class.text-red-500]="product.stock === 0"
              [class.text-yellow-400]="product.stock > 0 && product.stock <= 3"
              [class.text-green-400]="product.stock > 3"
            >
              {{ product.stock }}
            </span>
          </td>

          <td class="px-6 py-4">
            <span
              class="font-semibold"
              [class.text-green-400]="product.active"
              [class.text-red-500]="!product.active"
            >
              {{ product.active ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="px-6 py-4 items-center gap-3">
            <button
              (click)="openEditProduct(product)"
              class="px-6 py-2 rounded-md text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-white transition"
            >
              Edit
            </button>

            <button
              (click)="deleteProduct(product.id)"
              class="px-3 py-1 rounded-md text-xs font-semibold bg-pink-600 hover:text-red-700 text-white transition"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div
  *ngIf="showProductModal()"
  class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50"
>
  <div class="bg-[#0f0f0f] border border-white/10 rounded-2xl p-10 w-[650px] shadow-2xl text-white">

    <h2 class="text-3xl font-semibold mb-8">
      {{ editingProduct() ? 'Edit Product' : 'Add New Product' }}
    </h2>

    <form class="space-y-6">

      <!-- NAME -->
      <div>
        <label class="block text-sm mb-1 opacity-70">Name</label>
        <input
          type="text"
          [(ngModel)]="form().name"
          name="name"
          class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none"
        />
      </div>

      <!-- DESCRIPTION -->
      <div>
        <label class="block text-sm mb-1 opacity-70">Description</label>
        <textarea
          [(ngModel)]="form().description"
          name="description"
          rows="3"
          class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none"
        ></textarea>
      </div>

      <!-- PRICE + STOCK -->
      <div class="flex gap-6">
        <div class="flex-1">
          <label class="block text-sm mb-1 opacity-70">Price (€)</label>
          <input
            type="number"
            [(ngModel)]="form().price"
            name="price"
            class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none"
          />
        </div>

        <div class="flex-1">
          <label class="block text-sm mb-1 opacity-70">Stock</label>
          <input
            type="number"
            [(ngModel)]="form().stock"
            name="stock"
            class="w-full bg-white/5 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none"
          />
        </div>
      </div>

      <!-- IMAGE PREVIEW + CHOOSE BUTTON -->
      <div>
        <label class="block text-sm mb-2 opacity-70">Product Image</label>

        <div class="flex items-center gap-4">

          <!-- IMAGE PREVIEW -->
          <div
            class="w-28 h-28 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center overflow-hidden"
          >
            <img
              *ngIf="form().imageUrl"
              [src]="getImagePreviewUrl(form().imageUrl)"
              class="w-full h-full object-cover"
            />

            <span *ngIf="!form().imageUrl" class="text-xs opacity-50">
              No image
            </span>
          </div>

          <!-- CHOOSE BUTTON -->
          <button
            type="button"
            (click)="openImagePicker()"
            class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-semibold"
          >
            Choose Image
          </button>

        </div>
      </div>


      <!-- ACTION BUTTONS -->
      <div class="flex items-center justify-end gap-4 pt-4">

        <button
          type="button"
          (click)="showProductModal.set(false)"
          class="px-5 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm"
        >
          Cancel
        </button>

        <button
          type="button"
          (click)="saveProduct()"
          class="px-5 py-2 bg-pink-600 hover:bg-pink-700 rounded-lg text-sm font-semibold"
        >
          Save Product
        </button>

      </div>

    </form>
  </div>
</div>

<!-- IMAGE PICKER MODAL -->
<div
  *ngIf="showImagePicker()"
  class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50"
>
  <div class="bg-[#0f0f0f] border border-white/10 rounded-2xl p-10 w-[800px] shadow-2xl text-white">

    <div class="flex items-center justify-between mb-8">
      <h2 class="text-2xl font-semibold">Media Library</h2>

      <!-- ADD NEW IMAGE BUTTON -->
      <label
        class="px-4 py-2 bg-pink-600 hover:bg-pink-700 rounded-lg text-sm font-semibold cursor-pointer flex items-center gap-2"
      >
        <span class="text-lg font-bold">+</span> Add Image
        <input type="file" (change)="uploadNewImage($event)" class="hidden" />
      </label>
    </div>

    <!-- IMAGE GRID -->
    <div class="grid grid-cols-4 gap-6 max-h-[400px] overflow-y-auto pr-2">

      <div
        *ngFor="let img of images()"
        class="cursor-pointer border border-white/10 rounded-xl p-3 hover:bg-white/5 transition flex flex-col items-center"
        (click)="selectImage(img.name)"
      >
        <img [src]="img.url" class="w-full h-32 object-cover rounded-lg" />
        <p class="text-xs mt-3 opacity-80">{{ img.name }}</p>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="mt-8 text-right">
      <button
        (click)="showImagePicker.set(false)"
        class="px-5 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm"
      >
        Close
      </button>
    </div>

  </div>
</div>
